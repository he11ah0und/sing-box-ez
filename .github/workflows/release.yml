name: Release

on:
  push:
    branches: [main, testing]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.short }}
      body: ${{ steps.commit.outputs.message }}
      matrix: ${{ steps.matrix.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: commit
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi

          {
            echo 'message<<EOF'
            echo "## Changes since last release"
            echo ""
            git log "$range" --pretty=format:'%H' | while read hash; do
              subject=$(git log -1 --pretty=%s "$hash")
              body=$(git log -1 --pretty=%b "$hash")
              author=$(git log -1 --pretty=%an "$hash")
              date=$(git log -1 --pretty=%ad --date=format:'%Y-%m-%d %H:%M' "$hash")
              short=$(git rev-parse --short "$hash")
              echo "- \`$short\` $subject ($author, $date)"
              if [ -n "$body" ]; then
                echo ""
                echo "$body" | sed 's/^/  /'
                echo ""
              fi
            done
            echo ""
            echo "## Commit Info"
            echo ""
            echo "- **Hash:** $(git rev-parse HEAD)"
            echo "- **Author:** $(git log -1 --pretty=%an)"
            echo "- **Date:** $(git log -1 --pretty=%ad --date=format:'%Y-%m-%d %H:%M')"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate build matrix
        id: matrix
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            cat << 'EOF' > matrix.json
          [
            {"name":"linux-gui-wayland","os":"linux","arch":"amd64","gui":1,"backend":"wayland","compiler":"gcc","engine":"fyne","artifact":"build/sing-box-ez-amd64-linux-gcc-gui-wayland"},
            {"name":"linux-gui-x11","os":"linux","arch":"amd64","gui":1,"backend":"x11","compiler":"gcc","engine":"fyne","artifact":"build/sing-box-ez-amd64-linux-gcc-gui-x11"},
            {"name":"linux-cli-gcc","os":"linux","arch":"amd64","gui":0,"compiler":"gcc","artifact":"build/sing-box-ez-amd64-linux-gcc-cli"},
            {"name":"linux-cli-musl","os":"linux","arch":"amd64","gui":0,"compiler":"musl","artifact":"build/sing-box-ez-amd64-linux-musl-cli"},
            {"name":"windows-gui","os":"windows","arch":"amd64","gui":1,"compiler":"gcc","engine":"fyne","artifact":"build/sing-box-ez-amd64-windows-gcc-gui.exe"},
            {"name":"windows-cli","os":"windows","arch":"amd64","gui":0,"compiler":"gcc","artifact":"build/sing-box-ez-amd64-windows-gcc-cli.exe"}
          ]
          EOF
          else
            cat << 'EOF' > matrix.json
          [
            {"name":"linux-wayland","os":"linux","arch":"amd64","gui":1,"backend":"wayland","compiler":"gcc","artifact":"build/sing-box-ez-amd64-linux-gcc-gui-wayland"},
            {"name":"linux-x11","os":"linux","arch":"amd64","gui":1,"backend":"x11","compiler":"gcc","artifact":"build/sing-box-ez-amd64-linux-gcc-gui-x11"},
            {"name":"linux-cli-gcc","os":"linux","arch":"amd64","gui":0,"compiler":"gcc","artifact":"build/sing-box-ez-amd64-linux-gcc-cli"},
            {"name":"linux-cli-musl","os":"linux","arch":"amd64","gui":0,"compiler":"musl","artifact":"build/sing-box-ez-amd64-linux-musl-cli"},
            {"name":"windows-gui","os":"windows","arch":"amd64","gui":1,"compiler":"gcc","artifact":"build/sing-box-ez-amd64-windows-gcc-gui.exe"},
            {"name":"windows-cli","os":"windows","arch":"amd64","gui":0,"compiler":"gcc","artifact":"build/sing-box-ez-amd64-windows-gcc-cli.exe"}
          ]
          EOF
          fi
          {
            echo 'json<<EOF'
            cat matrix.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-release.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.name }}-${{ hashFiles('go.sum') }}

      - name: Set compiler with ccache
        run: |
          # Enable ccache via PATH (symlinks for common compilers)
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          if [ "${{ matrix.compiler }}" = "musl" ]; then
            echo "CC=musl-gcc" >> "$GITHUB_ENV"
            sudo ln -sf $(which ccache) /usr/lib/ccache/musl-gcc 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "windows" ]; then
            echo "CC=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
            sudo ln -sf $(which ccache) /usr/lib/ccache/x86_64-w64-mingw32-gcc 2>/dev/null || true
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          make setup \
            OS=${{ matrix.os }} \
            ARCH=${{ matrix.arch }} \
            GUI=${{ matrix.gui }} \
            COMPILER=${{ matrix.compiler }} \
            PLUGINS=0 \
            $( [ -n "${{ matrix.backend }}" ] && echo "GUI_BACKEND=${{ matrix.backend }}" ) \
            $( [ -n "${{ matrix.engine }}" ] && echo "ENGINE=${{ matrix.engine }}" )

      - name: Build ${{ matrix.name }}
        run: |
          make build \
            OS=${{ matrix.os }} \
            ARCH=${{ matrix.arch }} \
            GUI=${{ matrix.gui }} \
            COMPILER=${{ matrix.compiler }} \
            PLUGINS=0 \
            $( [ -n "${{ matrix.backend }}" ] && echo "GUI_BACKEND=${{ matrix.backend }}" ) \
            $( [ -n "${{ matrix.engine }}" ] && echo "ENGINE=${{ matrix.engine }}" )

      - name: Write status
        if: always()
        run: echo "${{ job.status }}" > status-${{ matrix.name }}.txt

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.artifact }}

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.name }}
          path: status-${{ matrix.name }}.txt

  finalize-release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: Build release notes and collect binaries
        run: |
          mkdir -p binaries

          # Base body from commit message
          cat > release_notes.md << 'EOF'
          ${{ needs.prepare-release.outputs.body }}
          EOF

          echo "" >> release_notes.md
          echo "## Build Status" >> release_notes.md
          echo "" >> release_notes.md

          # Collect status artifacts
          for f in artifacts/status-*/status-*.txt; do
            if [ -f "$f" ]; then
              name=$(basename "$f" .txt | sed 's/status-//')
              status=$(cat "$f")
              icon="✅"
              if [ "$status" != "success" ]; then
                icon="❌"
              fi
              echo "- $icon \`$name\`" >> release_notes.md
            fi
          done

          echo "" >> release_notes.md
          echo "## Binaries" >> release_notes.md
          echo "" >> release_notes.md

          # Collect binaries
          for f in artifacts/binary-*/sing-box-ez*; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              cp "$f" "binaries/$name"
              echo "- \`$name\`" >> release_notes.md
            fi
          done

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || needs.prepare-release.outputs.tag }}
          name: "${{ github.ref_name == 'main' && 'Latest Build' || 'Latest Testing Build' }} (${{ needs.prepare-release.outputs.tag }})"
          body_path: release_notes.md
          files: binaries/*
          draft: false
          prerelease: ${{ github.ref_name != 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
