name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.short }}
      body: ${{ steps.commit.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: commit
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range=""
          fi

          {
            echo 'message<<EOF'
            echo "## Changes since last release"
            echo ""
            git log "$range" --pretty=format:'- `%h` %s (%an, %ad)' --date=format:'%Y-%m-%d %H:%M'
            echo ""
            echo ""
            echo "## Commit Info"
            echo ""
            echo "- **Hash:** $(git rev-parse HEAD)"
            echo "- **Author:** $(git log -1 --pretty=%an)"
            echo "- **Date:** $(git log -1 --pretty=%ad --date=format:'%Y-%m-%d %H:%M')"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-wayland
            os: linux
            arch: amd64
            gui: 1
            backend: wayland
            compiler: gcc
            artifact: build/sing-box-ez-linux-amd64-wayland-gcc
          - name: linux-x11
            os: linux
            arch: amd64
            gui: 1
            backend: x11
            compiler: gcc
            artifact: build/sing-box-ez-linux-amd64-x11-gcc
          - name: linux-cli-gcc
            os: linux
            arch: amd64
            gui: 0
            compiler: gcc
            artifact: build/sing-box-ez-linux-amd64-cli-gcc
          - name: linux-cli-musl
            os: linux
            arch: amd64
            gui: 0
            compiler: musl
            artifact: build/sing-box-ez-linux-amd64-cli-musl
          - name: windows-gui
            os: windows
            arch: amd64
            gui: 1
            compiler: gcc
            artifact: build/sing-box-ez-windows-amd64-gcc.exe
          - name: windows-cli
            os: windows
            arch: amd64
            gui: 0
            compiler: gcc
            artifact: build/sing-box-ez-windows-amd64-cli-gcc.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.name }}-${{ hashFiles('go.sum') }}

      - name: Set compiler with ccache
        run: |
          # Enable ccache via PATH (symlinks for common compilers)
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          if [ "${{ matrix.compiler }}" = "musl" ]; then
            echo "CC=musl-gcc" >> "$GITHUB_ENV"
            sudo ln -sf $(which ccache) /usr/lib/ccache/musl-gcc 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "windows" ]; then
            echo "CC=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
            sudo ln -sf $(which ccache) /usr/lib/ccache/x86_64-w64-mingw32-gcc 2>/dev/null || true
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          make setup \
            OS=${{ matrix.os }} \
            ARCH=${{ matrix.arch }} \
            GUI=${{ matrix.gui }} \
            COMPILER=${{ matrix.compiler }} \
            PLUGINS=0 \
            $( [ -n "${{ matrix.backend }}" ] && echo "GUI_BACKEND=${{ matrix.backend }}" )

      - name: Build ${{ matrix.name }}
        run: |
          make build \
            OS=${{ matrix.os }} \
            ARCH=${{ matrix.arch }} \
            GUI=${{ matrix.gui }} \
            COMPILER=${{ matrix.compiler }} \
            PLUGINS=0 \
            $( [ -n "${{ matrix.backend }}" ] && echo "GUI_BACKEND=${{ matrix.backend }}" )

      - name: Write status
        if: always()
        run: echo "${{ job.status }}" > status-${{ matrix.name }}.txt

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.artifact }}

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.name }}
          path: status-${{ matrix.name }}.txt

  finalize-release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: Build release notes and collect binaries
        run: |
          mkdir -p binaries

          # Base body from commit message
          cat > release_notes.md << 'EOF'
          ${{ needs.prepare-release.outputs.body }}
          EOF

          echo "" >> release_notes.md
          echo "## Build Status" >> release_notes.md
          echo "" >> release_notes.md

          for name in linux-wayland linux-x11 linux-cli-gcc linux-cli-musl windows-gui windows-cli; do
            status_file="artifacts/status-${name}/status-${name}.txt"
            binary_dir="artifacts/binary-${name}"

            if [ -f "$status_file" ]; then
              status=$(cat "$status_file")
            else
              status="failure"
            fi

            if [ "$status" = "success" ]; then
              echo "- ✅ ${name}" >> release_notes.md
              if [ -d "$binary_dir" ]; then
                cp "${binary_dir}"/* binaries/ 2>/dev/null || true
              fi
            else
              echo "- ❌ ${name}" >> release_notes.md
            fi
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prepare-release.outputs.tag }}"

          # Create release if it doesn't exist; ignore error if it does
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release_notes.md 2>/dev/null || true

          # Upload binaries (overwrite existing)
          for f in binaries/*; do
            [ -f "$f" ] || continue
            gh release upload "$tag" "$f" --clobber || true
          done

          # Update release notes
          gh release edit "$tag" --notes-file release_notes.md
