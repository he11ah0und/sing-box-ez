name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-wayland
            os: linux
            arch: amd64
            gui: 1
            backend: wayland
            compiler: gcc
            artifact: build/sing-box-ez-linux-amd64-wayland-gcc
          - name: linux-x11
            os: linux
            arch: amd64
            gui: 1
            backend: x11
            compiler: gcc
            artifact: build/sing-box-ez-linux-amd64-x11-gcc
          - name: linux-cli-gcc
            os: linux
            arch: amd64
            gui: 0
            compiler: gcc
            artifact: build/sing-box-ez-linux-amd64-cli-gcc
          - name: linux-cli-musl
            os: linux
            arch: amd64
            gui: 0
            compiler: musl
            artifact: build/sing-box-ez-linux-amd64-cli-musl
          - name: windows-gui
            os: windows
            arch: amd64
            gui: 1
            compiler: gcc
            artifact: build/sing-box-ez-windows-amd64-gcc.exe
          - name: windows-cli
            os: windows
            arch: amd64
            gui: 0
            compiler: gcc
            artifact: build/sing-box-ez-windows-amd64-cli-gcc.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.name }}-${{ hashFiles('go.sum') }}

      - name: Set compiler with ccache
        run: |
          if [ "${{ matrix.compiler }}" = "musl" ]; then
            echo "CC=ccache musl-gcc" >> "$GITHUB_ENV"
          elif [ "${{ matrix.os }}" = "windows" ]; then
            echo "CC=ccache x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
          else
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          make setup \
            OS=${{ matrix.os }} \
            ARCH=${{ matrix.arch }} \
            GUI=${{ matrix.gui }} \
            COMPILER=${{ matrix.compiler }} \
            $( [ -n "${{ matrix.backend }}" ] && echo "GUI_BACKEND=${{ matrix.backend }}" )

      - name: Build ${{ matrix.name }}
        run: |
          make build \
            OS=${{ matrix.os }} \
            ARCH=${{ matrix.arch }} \
            GUI=${{ matrix.gui }} \
            COMPILER=${{ matrix.compiler }} \
            $( [ -n "${{ matrix.backend }}" ] && echo "GUI_BACKEND=${{ matrix.backend }}" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get commit info
        id: commit
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo 'message<<EOF'
            git log -1 --pretty=%B
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.short }}
          name: ${{ steps.commit.outputs.short }}
          body: ${{ steps.commit.outputs.message }}
          files: artifacts/*
