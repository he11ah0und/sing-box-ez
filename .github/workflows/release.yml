name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            mingw-w64

      - name: Build linux-wayland
        run: make build OS=linux ARCH=amd64 GUI=1 GUI_BACKEND=wayland

      - name: Build linux-x11
        run: make build OS=linux ARCH=amd64 GUI=1 GUI_BACKEND=x11

      - name: Build linux-nogui
        run: make build OS=linux ARCH=amd64 GUI=0

      - name: Build windows-gui
        run: make build OS=windows ARCH=amd64 GUI=1

      - name: Build windows-nogui
        run: make build OS=windows ARCH=amd64 GUI=0

      - name: Get commit info
        id: commit
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo 'message<<EOF'
            git log -1 --pretty=%B
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.short }}
          name: ${{ steps.commit.outputs.short }}
          body: ${{ steps.commit.outputs.message }}
          files: build/sing-box-ez-*
