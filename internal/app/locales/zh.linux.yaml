# 仅 Linux 的字符串，在 linux 构建上深合并到 zh.yaml 之上。
core:
  privileges:
    setcap_active: 权限：setcap 已启用
    root_required: 权限：TUN 需要 root 权限
    setcap_hint: setcap 为核心二进制文件授予 cap_net_admin 能力，TUN 无需 root 即可运行
  setcap:
    unavailable: 此操作系统不支持 setcap
settings:
  privileges:
    setcap: 应用 setcap
    setcap_remove: 移除 setcap
    setcap_done: setcap 已应用——TUN 无需 root 即可工作
    setcap_removed: setcap 已移除——TUN 将需要 root 权限
    setcap_confirm: setcap 未应用到核心二进制文件。立即应用以无需 root 使用 TUN？
    setcap_remove_confirm: 移除核心二进制文件的 cap_net_admin 能力？TUN 将需要 root 权限。
startup:
  mode_systemd-user: systemd 用户
dialog:
  privileges:
    msg: 'sing-box 需要提升的权限来创建 TUN 设备。


      请在下方应用 setcap，为内核授予所需权限，无需以 root 身份运行。'
    btn_setcap: 应用 setcap（推荐）
  privileges_required:
    body: 配置使用了 TUN（或透明代理）inbound，需要提升的权限。请在设置中为内核二进制文件应用 setcap。
progress:
  applying_setcap: 应用 setcap 中...
