meta:
  type: logs
  binding: internal

# Log message formats, keyed by <scope>.<snake_case>. English only: the en
# file is the fallback for every lookup and the source of the keys the code
# references. Format verbs and argument order must match the call sites.
app:
  started: sing-box-ez starting (commit %s)
core:
  auto_restart_failed: "Auto-restart failed: %v"
  invalid_core_version: "Invalid core version %q, using latest schema: %v"
  controller:
    find_free_api_port_failed: "failed to find free API port: %v"
    apply_api_override_failed: "failed to apply API override: %v"
    config_unknown_fields_after_inbounds: "Config contains unknown fields after inbounds override: %v"
    create_api_client_failed: "Failed to create sing-box API client: %v"
    local_config_url_update: "Local config %q cannot be updated from a URL"
    config_updated: "Config updated: %s"
    core_up_to_date: "Core is up to date: %s"
    latest_core_version: "Latest core version: %s"
    stopping_core_for_update: Stopping core for update
    core_downloaded: "Core downloaded to: %s"
    name_required: Name is required
    url_required_remote: URL is required for remote configs
    config_already_exists: Config with this name already exists
    config_added: "Config added: %s"
    config_name_already_exists: "Config with name %q already exists"
    config_renamed: "Config renamed: %s -> %s"
    config_deleted: "Config deleted: %s"
    no_cached_config: "No cached config for: %s"
    config_activated: "Activated config: %s"
    no_configs_to_update: No configs to update
    updating_config: "Updating config: %s..."
    update_all_finished: "Update all finished (%d/%d)"
    config_file_not_found: "Config file not found: %s"
    opening_config_file: "Opening config file: %s"
    opening_config_dir: "Opening config directory: %s"
    only_local_recreate: Only local configs can be recreated
    recreated_local_config: "Recreated local config: %s"
    import_config_not_found: "Config not found for import: %s"
    only_local_import: Only local configs can import a source file
    import_read_failed: "Failed to read source file: %v"
    import_not_json: "Source file is not valid JSON: %s"
    local_config_imported: "Local config content imported: %s"
    setcap_failed: "setcap failed: %v; tip: run manually: sudo setcap cap_net_admin=+ep ./sing-box"
    setcap_applied: setcap applied successfully.
    log_limit_set: "Log limit set to %d"
    default_interval_set: "Default interval set to %dh"
    auto_restart: "Auto-restart: %v"
    config_updating: Updating config...
    config_update_skipped: Config update skipped by user
    config_update_skipped_once: Config update skipped for this start (retry via core pending)
    using_existing_config: Using existing config
    no_core_proxy: Core is not running or has no local proxy inbound; cannot download via core
    config_update_finished: Config updated
    sing_box_started: Sing-box started
    sing_box_stopped: Sing-box stopped
    restarting: Restarting...
    sing_box_restarted: Sing-box restarted
  log_processor:
    fatal_auto_restart: "Detected core fatal error, auto-restarting..."
  privileges:
    action_failed: "privilege action %s failed: %v"
    setcap_tip: "Tip: run manually: sudo setcap cap_net_admin=+ep ./sing-box"
    action_succeeded: "privilege action %s succeeded"
  interactive:
    log_message: "%s"
    detect_style_failed: "Failed to detect config style: %v"
    set_fallback_type_failed: "Failed to set fallback_type: %v"
    start_failed: "Failed to start: %v"
    start_cancelled: "Start cancelled by user"
    stop_failed: "Failed to stop: %v"
    auto_updating_config: "Auto-updating config: %s"
    active_config_updated_restarting: "Active config updated, restarting core..."
    auto_restart_skipped_start_in_flight: "Active config updated while a start is in flight, skipping auto-restart"
