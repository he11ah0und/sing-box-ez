    save_failed: "failed to save core log level: %v"
    updated: "Core log level updated"
    unknown_fields: "Config contains unknown fields after log override"
  manager:
    restarting_after_update: "Restarting core after update"
    restart_after_update_failed: "Failed to restart core after update: %v"
framework:
  started: framework started
  stopped: framework stopped
fs:
  stat: "stat %q: %w"
  rename: "rename %q → %q: %w"
  remove: "remove %q: %w"
  chmod: "chmod %q: %w"
  read_dir: "read dir %q: %w"
